<title>Hedi Kopfrechnen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* ---------- Token: Rechenheft, kühles Papier + Türkis-Tinte ---------- */
:root{
  --paper:#f2f4f7; --card:#ffffff; --ink:#1b2735; --muted:#5a7182;
  --accent:#09687d; --accent-ink:#ffffff; --soft:#dcedf2; --warm:#a85a15;
  --line:#dde3ea; --shadow:0 1px 2px rgba(27,39,53,.07), 0 4px 14px rgba(27,39,53,.05);
  --s0:#e9eeef; --s1:#d9e4e7; --s2:#c6dbe0; --s3:#add1d9; --s4:#8fc7d4;
  --s5:#67bccf; --s6:#33adc8; --s7:#2499b4; --s8:#168199; --s9:#0c6275;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131a21; --card:#1c252e; --ink:#e8eef4; --muted:#94a3b3;
    --accent:#61c4da; --accent-ink:#0d1519; --soft:#1c3439; --warm:#e0a05a;
    --line:#2a3540; --shadow:0 1px 2px rgba(0,0,0,.4);
    --s0:#232a2c; --s1:#3f5459; --s2:#4b6f77; --s3:#51848f; --s4:#5295a4;
    --s5:#58a4b5; --s6:#63b1c3; --s7:#6fbdce; --s8:#7bc7d8; --s9:#87d1e1;
  }
}
:root[data-theme="dark"]{
  --paper:#131a21; --card:#1c252e; --ink:#e8eef4; --muted:#94a3b3;
  --accent:#61c4da; --accent-ink:#0d1519; --soft:#1c3439; --warm:#e0a05a;
  --line:#2a3540; --shadow:0 1px 2px rgba(0,0,0,.4);
  --s0:#232a2c; --s1:#3f5459; --s2:#4b6f77; --s3:#51848f; --s4:#5295a4;
  --s5:#58a4b5; --s6:#63b1c3; --s7:#6fbdce; --s8:#7bc7d8; --s9:#87d1e1;
}

*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100vh; height:100dvh}
body{
  font:400 16px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif;
  font-variant-numeric:tabular-nums;
  background:var(--paper); color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation; overflow:hidden; overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
}
/* Am Viewport festgemacht, nicht am Elternelement: im Artifact-Rahmen reicht der
   Host seine Höhe nicht durch, dann wüchse die Seite nach unten aus dem Bild. */
#app{
  position:fixed; inset:0; margin:auto;
  width:100%; max-width:410px; height:100dvh; max-height:min(100dvh, 820px);
  padding:calc(max(10px, 2vh) + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(max(10px, 2vh) + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  display:flex; flex-direction:column;
}
/* gap skaliert mit der Höhe — auf dem iPhone SE bleibt so alles auf einem Bild */
.screen{display:none; flex:1; flex-direction:column; gap:clamp(6px, 1.8vh, 16px); min-height:0}
/* Start und Ende tragen mehr Zeilen als das Quiz — dort enger stapeln */
#s-start, #s-done{gap:clamp(4px, 1.2vh, 12px)}
.screen.on{display:flex}

h1{
  font-family:Fraunces,Georgia,serif; font-weight:600; font-size:clamp(22px, 4vh, 30px);
  letter-spacing:-.015em; text-align:center; text-wrap:balance;
}
.sub{color:var(--muted); font-size:14px; text-align:center}
.spacer{flex:1; min-height:0}

button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.big{
  background:var(--accent); color:var(--accent-ink); font-size:clamp(18px, 2.6vh, 21px);
  font-weight:700; min-height:56px; padding:clamp(12px, 2.2vh, 18px);
  border-radius:14px; width:100%; box-shadow:var(--shadow); flex:none;
}
.big:active{transform:translateY(1px)}
/* Der Weg nach vorn: eigener Luftraum über und unter dem Knopf, damit er nicht
   als eine Zeile unter vielen gelesen wird. Alles andere daneben ist Option. */
#go{
  margin:clamp(10px, 2.6vh, 26px) 0 clamp(8px, 1.8vh, 16px);
  box-shadow:0 2px 4px rgba(9,104,125,.22), 0 8px 20px rgba(9,104,125,.16);
  letter-spacing:.01em;
}
:root[data-theme="dark"] #go, :root:not([data-theme="light"]) #go{
  box-shadow:0 2px 6px rgba(0,0,0,.45);
}
/* Touch-Ziele: mindestens 44×44px (Apple HIG). Bei Links, wo die Höhe knapp ist,
   erweitert negatives Margin die Trefferfläche, ohne Layout-Höhe zu kosten. */
.link{
  color:var(--muted); font-size:15px; text-decoration:underline;
  display:inline-flex; align-items:center; justify-content:center;
  min-height:44px; padding:0 14px;
}

/* ---------- Reiter je Rechenart ----------
   Bewusst leicht gehalten: sie wählen nur aus, sie sind nicht die Handlung.
   Das visuelle Gewicht gehört dem Üben-Button. */
.tabs{
  display:grid; grid-template-columns:repeat(4,1fr); flex:none;
  border-bottom:1px solid var(--line);
}
.tabs button{
  min-height:44px; font-weight:700; font-size:clamp(13px, 1.9vh, 15px);
  color:var(--muted); position:relative; padding:0 2px;
  border-bottom:3px solid transparent; margin-bottom:-1px;
  transition:color .15s;
}
.tabs button[aria-selected="true"]{
  color:var(--ink); border-bottom-color:var(--accent);
}
.tabs button:active{color:var(--ink)}

/* ---------- Landkarte: 10×10-Gitter ---------- */
.map{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:clamp(6px, 1.2vh, 10px); box-shadow:var(--shadow);
  display:grid; grid-template-columns:repeat(11,1fr); gap:2px;
  width:100%; max-width:min(100%, 31vh); margin-inline:auto; flex:none;
}
/* KEIN background hier — .map div (0,1,1) würde jede .sN-Klasse (0,1,0) überstimmen */
.map div{aspect-ratio:1; border-radius:2px}
.map .hd{
  background:none; color:var(--muted); font-size:9px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.s0{background:var(--s0)} .s1{background:var(--s1)} .s2{background:var(--s2)}
.s3{background:var(--s3)} .s4{background:var(--s4)} .s5{background:var(--s5)}
.s6{background:var(--s6)} .s7{background:var(--s7)} .s8{background:var(--s8)}
.s9{background:var(--s9)}
.map div{transition:background-color .45s ease}
.legend{
  display:flex; align-items:center; justify-content:center; gap:7px;
  font-size:11px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase;
}
.legend i{width:min(3.2vw, 14px); height:min(3.2vw, 14px); border-radius:2px}
.legend .bar{display:flex; gap:2px}
.legend{min-height:2.2em}
.legend.info{text-transform:none; letter-spacing:0; color:var(--ink); font-size:12px}
.map div[data-k]{cursor:pointer}

/* ---------- Aufgabe ---------- */
.top{display:flex; align-items:center; gap:8px; flex:none}
.back{
  flex:none; font-size:14px; font-weight:700; color:var(--muted);
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  min-height:40px; padding:0 12px;
}
.back:active{background:var(--soft)}
.dots{display:flex; flex:1; gap:5px; justify-content:center; flex-wrap:wrap}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--s0)}
.dots i.done{background:var(--accent)}

.stage{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; min-height:0;
}
/* Aufgabe und Eingabe stehen auf einer Zeile: „7 × 8 = 56".
   Die Größe ist so gewählt, dass auch die längste Zeile („100 : 10 = 10")
   in die 343px eines iPhone-Hochformats passt. */
.eq{
  display:flex; align-items:baseline; justify-content:center; gap:.26em;
  font-size:min(12vw, 6.5vh, 46px); font-weight:700; letter-spacing:.03em;
  width:100%;
}
.task{font-size:1em; white-space:nowrap}
.answer{
  font-size:1em; color:var(--accent); min-width:3.2ch; text-align:center;
  border-bottom:3px solid var(--line); padding:0 .12ch;
  animation:rise .22s ease-out;
}
.answer:empty::after{content:"\00a0"}
.stage.bad .answer{color:var(--warm); border-color:var(--warm); animation:reveal .3s}
.stage.bad .hint{color:var(--warm); font-weight:700}
@keyframes reveal{from{opacity:0; transform:scale(.85)} to{opacity:1; transform:none}}
.stage.good .answer{border-color:var(--accent)}
.hint{font-size:min(4.2vw, 2.2vh, 17px); color:var(--muted); min-height:2.4em;
      text-align:center; padding-top:clamp(4px, 1.2vh, 10px)}

/* Rechenweg bei einem Fehler — bekommt den Platz des Zahlenpads */
.tip{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:clamp(10px, 2vh, 16px); box-shadow:var(--shadow); text-align:left;
  width:100%; max-width:340px; margin:clamp(6px, 1.5vh, 14px) auto 0;
  animation:rise .3s .1s backwards;
}
.tip h2{
  font-size:clamp(12px, 1.8vh, 14px); font-weight:700; color:var(--warm);
  text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;
}
.tip ol{list-style:none; display:flex; flex-direction:column; gap:clamp(3px, .9vh, 7px)}
.tip li{
  font-size:clamp(14px, 2.3vh, 18px); color:var(--ink); font-weight:700;
  display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:baseline;
}
.tip li span{color:var(--muted); font-weight:400; font-size:.75em}
@keyframes rise{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}

/* ---------- Belohnung ---------- */
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:20}
.stage.good .answer{animation:pop .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)} 45%{transform:scale(1.16)} 100%{transform:scale(1)}}
.stage.win .answer{animation:cheer .55s cubic-bezier(.34,1.56,.64,1)}
/* Hüpfen statt stark vergrößern: die Antwort steht jetzt neben dem
   Gleichheitszeichen, viel Breitenzuwachs würde dort hineinlaufen. */
@keyframes cheer{
  0%  {transform:translateY(0) scale(1) rotate(0)}
  30% {transform:translateY(-16%) scale(1.1) rotate(-3deg)}
  60% {transform:translateY(0) scale(1.04) rotate(2deg)}
  100%{transform:translateY(0) scale(1) rotate(0)}
}
.stage.win .hint{color:var(--accent); font-weight:700; animation:rise .3s .1s backwards}
/* frisch eroberte Felder leuchten der Reihe nach auf */
.map .won{animation:won .7s backwards}
@keyframes won{
  0%{transform:scale(.4); opacity:.3}
  55%{transform:scale(1.5); opacity:1; box-shadow:0 0 0 3px var(--accent)}
  100%{transform:scale(1); opacity:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

/* Wenig Höhe (Safari mit Adressleiste, kleine Geräte): Bedienelemente behalten
   ihre 44px, dafür schrumpfen Landkarte, Titel und Beiwerk. */
@media (max-height: 700px){
  .map{max-width:min(100%, 27vh)}
  .legend{min-height:1.6em; font-size:10px}
  h1{font-size:clamp(20px, 3.4vh, 26px)}
}
@media (max-height: 620px){
  #go{margin:clamp(8px, 1.4vh, 14px) 0 clamp(6px, 1vh, 10px)}
}
@media (max-height: 600px){
  .legend{display:none}
  .map{max-width:min(100%, 23vh)}
}
/* Ganz wenig Höhe: die Reihen-Auswahl weicht, „Üben" genügt */
@media (max-height: 500px){
  .rows{display:none !important}
  .steps{gap:2px}
  .steps div{font-size:10px; padding:1px 4px}
  .steps b{height:9px}
}
@media (max-height: 460px){
  #saveNote{display:none}
  #go{margin:6px 0 4px}
}

/* ---------- Zahlenpad ---------- */
/* feste Höhe, 4 gleiche Reihen: das Pad schrumpft mit dem Gerät statt zu überlaufen.
   Untergrenze 232px hält die Tasten über Apples 44px-Mindestgröße. */
.pad{
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(4,1fr);
  gap:clamp(5px, 1vh, 8px); flex:none;
  height:clamp(232px, 42vh, 296px);
}
.pad button{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  font-size:min(6.5vw, 3.4vh, 25px); font-weight:700; min-height:0; padding:0;
  box-shadow:var(--shadow);
}
.pad button:active{background:var(--soft)}
.pad .ok{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.pad .del{color:var(--muted); font-weight:400}
.pad button[disabled]{opacity:.4}

/* ---------- Abschluss ---------- */
.stats{display:flex; gap:8px; flex:none}
.stat{
  flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:clamp(8px, 1.6vh, 12px) 6px; text-align:center; box-shadow:var(--shadow);
}
.stat b{display:block; font-size:clamp(19px, 3vh, 23px); font-weight:700}
.stat span{font-size:11px; color:var(--muted); letter-spacing:.03em}
.mk{width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:4px}
.mk.r{background:var(--accent)} .mk.w{background:var(--warm)}
.rows{display:grid; grid-template-columns:repeat(5,1fr); gap:7px; flex:none}
.rows button{
  background:none; border:1px solid var(--line); border-radius:10px;
  min-height:46px; padding:0 0 5px; font-weight:600; font-size:clamp(13px, 1.9vh, 15px);
  color:var(--muted); position:relative; overflow:hidden;
}
.rows button:active{background:var(--soft)}
/* Farbbalken statt eingefärbter Fläche: die Beschriftung bleibt lesbar */
.rows button::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:5px;
  background:var(--rowcolor, var(--s0));
}
.rows button[disabled]{opacity:.55; cursor:default}
.rows button[disabled]::after{height:100%; opacity:.16}

/* ---------- Plus und Minus: Typen statt Einzelaufgaben ---------- */
.steps{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:clamp(6px, 1.2vh, 10px); box-shadow:var(--shadow); flex:none;
  display:flex; flex-direction:column; gap:clamp(3px, .7vh, 6px);
}
.steps div{
  display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px;
  font-size:clamp(11px, 1.7vh, 13px); cursor:pointer;
  padding:clamp(2px, .5vh, 5px) 4px; border-radius:6px;
}
.steps div:hover{background:var(--soft)}
.steps b{
  display:block; width:clamp(56px, 22vw, 84px); height:11px; border-radius:3px;
  background:var(--s0);
}
.links{display:flex; justify-content:center; gap:8px; flex:none}

/* ---------- Verlauf: ein Balken je Tag, eine Serie ---------- */
.chart{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:12px 12px 8px; box-shadow:var(--shadow); flex:none;
}
.cmax{font-size:11px; color:var(--muted); text-align:right; margin-bottom:4px}
.bars{
  display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:3px;
  height:clamp(90px, 18vh, 140px); align-items:end;
  border-bottom:1px solid var(--line);
}
.bars span{
  display:flex; flex-direction:column; justify-content:flex-end; gap:2px;
  min-height:2px; cursor:pointer; transition:opacity .15s;
}
.bars span:hover{opacity:.7}
.bars i{display:block; width:100%; min-height:2px; pointer-events:none}
.bars .r{background:var(--accent)}          /* richtig */
.bars .w{background:var(--warm)}            /* falsch  */
.bars .cap{border-radius:4px 4px 0 0}       /* nur das obere Datenende ist rund */
.bars .none{background:var(--line); border-radius:2px; height:2px}
.bars span.today .r{background:var(--s9)}
.clegend{
  display:flex; justify-content:center; gap:14px; font-size:11px;
  color:var(--muted); padding-top:8px;
}
.clegend i{width:10px; height:10px; border-radius:2px; display:inline-block; margin-right:4px}
.cdays{
  display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:3px;
  font-size:10px; color:var(--muted); text-align:center; padding-top:4px;
}
</style>

<div id="app">

  <!-- ---------- START ---------- -->
  <section id="s-start" class="screen on">
    <h1>Hedi Kopfrechnen</h1>
    <div class="tabs" id="tabs"></div>
    <button class="big" id="go">Mal üben</button>
    <div class="rows" id="rows"></div>
    <div class="spacer"></div>
    <div id="grid"></div>
    <p class="legend"></p>
    <p class="sub" id="saveNote" style="font-size:12px">Fortschritt wird automatisch gespeichert</p>
    <div class="links">
      <button class="link" id="logOpen">Verlauf</button>
      <button class="link" id="exp">Sicherungskopie kopieren</button>
    </div>
  </section>

  <!-- ---------- AUFGABE ---------- -->
  <section id="s-quiz" class="screen">
    <div class="top">
      <button class="back" id="quit">‹ Übersicht</button>
      <div class="dots" id="dots"></div>
    </div>
    <div class="stage" id="stage">
      <div class="eq" aria-live="polite" aria-atomic="true">
        <span class="task" id="task"></span>
        <span class="answer" id="ans"></span>
      </div>
      <div class="hint" id="hint" aria-live="polite"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="pad" id="pad"></div>
    <button class="big" id="gotIt" hidden>Verstanden</button>
  </section>

  <!-- ---------- VERLAUF ---------- -->
  <section id="s-log" class="screen">
    <h1>Verlauf</h1>
    <div class="stats">
      <div class="stat"><b id="lRight">0</b><span><i class="mk r"></i>richtig</span></div>
      <div class="stat"><b id="lWrong">0</b><span><i class="mk w"></i>falsch</span></div>
      <div class="stat"><b id="lRate">–</b><span>Trefferquote</span></div>
    </div>
    <p class="sub" id="lTotal" style="font-size:12px"></p>
    <div class="chart">
      <div class="cmax" id="lMax"></div>
      <div class="bars" id="lBars"></div>
      <div class="cdays" id="lLabels"></div>
      <p class="clegend"><span><i class="r"></i>richtig</span><span><i class="w"></i>falsch</span></p>
    </div>
    <p class="sub" id="lTip" style="font-size:12px; min-height:2.4em"></p>
    <div class="spacer"></div>
    <button class="link" id="logBack">‹ Zurück</button>
  </section>

  <!-- ---------- ENDE ---------- -->
  <section id="s-done" class="screen">
    <h1 id="doneTitle">Geschafft</h1>
    <div class="stats">
      <div class="stat"><b id="dRight">0</b><span>richtig</span></div>
      <div class="stat"><b id="dNew">0</b><span>neu gemerkt</span></div>
      <div class="stat"><b id="dStreak">0</b><span>Tage am Stück</span></div>
    </div>
    <div id="grid2"></div>
    <p class="legend"></p>
    <div class="spacer"></div>
    <button class="big" id="home">Zur Übersicht</button>
    <button class="link" id="again">Noch eine Runde</button>
  </section>

</div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
/* ============================================================
   Einmaleins-Trainer
   Leitner-Boxen + Antwortzeit als Signal für echtes Auswendigwissen
   ============================================================ */

const KEY = 'einmaleins.v1';
const N = 10;                         // Reihen 1..10
const SESSION_LEN = 20;               // Aufgaben pro Runde
const FAST_MS = 5000;                 // schneller => abgerufen, nicht gerechnet
const REDO_GAP = 3;                   // Fehler kommt nach 3 Aufgaben wieder
const SHADES = 9;                     // Stufen 0..9 — zehn Farbkodierungen auf der Landkarte
const P_FAST = 2;                     // schnell und richtig  => zwei Stufen
const P_SLOW = 1;                     // richtig, aber gerechnet => eine Stufe
const P_WRONG = 3;                    // Fehler kostet — löscht aber nie alles
const INTERVAL = [0,1,2,4,8,16];      // INTERVAL[box] = Sessions bis wieder fällig

/* ---------- Rechenarten, Aufgaben, Schwierigkeit ---------- */

// Jede Rechenart hat einen eigenen Aufgabenraum, eigene Landkarte, eigenen Fortschritt.
// Mal und Geteilt haben je 100 feste Aufgaben. Plus und Minus hätten tausende,
// deshalb ist dort der "Fakt" ein Aufgabentyp und die Zahlen werden erzeugt.
const MODES = ['m','d','p','s'];
const MODE = {
  m: { label:'Mal',     sign:'×', grid:true  },
  d: { label:'Geteilt', sign:':', grid:true  },
  p: { label:'Plus',    sign:'+', grid:false },
  s: { label:'Minus',   sign:'−', grid:false }
};

const isEasyN = n => n===1 || n===2 || n===5 || n===10;

// 0 = leicht, 1 = mittel, 2 = hart
function difficulty(a, b){
  if (isEasyN(a) || isEasyN(b)) return 0;
  if (a === b) return 1;                    // Quadrate sitzen erfahrungsgemäß früher
  if (a >= 6 || b >= 6) return 2;
  return 1;
}

const between = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));

// Aufgabentypen für Plus und Minus, vom Leichten zum Schweren.
// gen() liefert die beiden Summanden. Zehner und Einer werden getrennt gewürfelt:
// nur so ist "mit/ohne Zehnerübergang" garantiert und die 100 wird nie gerissen.
const STEPS = [
  { id:'z20', name:'bis 20', diff:0,
    gen: () => { const b = between(2,9); return [between(2, 19-b), b]; } },

  { id:'zeh', name:'glatte Zehner', diff:0,
    gen: () => { const t = between(1,8); return [t*10, between(1, 10-t)*10]; } },

  { id:'ze', name:'Zehner und Einer', diff:0,
    gen: () => [between(1,9)*10, between(1,9)] },

  { id:'e1', name:'einstellig, kein Übergang', diff:1,
    gen: () => { const e = between(0,8); return [between(1,9)*10 + e, between(1, 9-e)]; } },

  { id:'e2', name:'einstellig mit Übergang', diff:2,
    gen: () => { const e = between(1,9); return [between(1,8)*10 + e, between(10-e, 9)]; } },

  { id:'z1', name:'volle Zehner dazu', diff:1,
    gen: () => { const t = between(1,8); return [t*10 + between(1,9), between(1, 9-t)*10]; } },

  { id:'d1', name:'zweistellig, kein Übergang', diff:1,
    gen: () => { const e = between(0,9), t = between(1,8);
                 return [t*10 + e, between(1, 9-t)*10 + between(0, 9-e)]; } },

  { id:'d2', name:'zweistellig mit Übergang', diff:2,
    gen: () => { const e = between(1,9), t = between(1,7);
                 return [t*10 + e, between(1, 8-t)*10 + between(10-e, 9)]; } }
];

function seedFacts(){
  const f = {};
  const blank = box => ({ box, solved: 0, lastSession: 0, times: [], tries: 0, wrong: 0 });
  for (let a=1; a<=N; a++) for (let b=1; b<=N; b++){
    const start = [3,2,1][difficulty(a,b)];      // leicht startet in Box 3, hart in Box 1
    f['m:'+a+'x'+b] = blank(start);
    f['d:'+(a*b)+'/'+b] = blank(start);          // dieselbe Aufgabe rückwärts
  }
  for (const st of STEPS){
    const start = [3,2,1][st.diff];
    f['p:'+st.id] = blank(start);
    f['s:'+st.id] = blank(start);
  }
  return f;
}

const modeOf = k => k[0];
const bodyOf = k => k.slice(2);
const factsOf = (st, mode) => Object.keys(st.facts).filter(k => modeOf(k) === mode);

// Konkrete Aufgabe zu einem Fakt. Bei Plus/Minus sind die Zahlen jedes Mal andere,
// deshalb hält die Runde das Ergebnis fest — sonst käme die Wiederholung
// eines Fehlers mit anderen Zahlen daher.
function makeTask(k){
  const m = modeOf(k), body = bodyOf(k);
  if (m === 'm'){ const [a,b] = body.split('x').map(Number); return { text:`${a} × ${b}`, answer:a*b }; }
  if (m === 'd'){ const [p,b] = body.split('/').map(Number); return { text:`${p} : ${b}`, answer:p/b }; }
  const [a,b] = STEPS.find(s => s.id === body).gen();
  if (m === 'p') return { text:`${a} + ${b}`, answer:a+b };
  return { text:`${a+b} − ${b}`, answer:a };     // Minus ist Plus rückwärts
}

// Schwierigkeit eines Fakts, unabhängig von der Rechenart
function factDiff(k){
  const m = modeOf(k), body = bodyOf(k);
  if (m === 'm') return difficulty(...body.split('x').map(Number));
  if (m === 'd'){ const [p,b] = body.split('/').map(Number); return difficulty(p/b, b); }
  return STEPS.find(s => s.id === body).diff;
}

// Gehört ein Fakt zur Reihe n? (nur Mal und Geteilt)
function inRow(k, n){
  const m = modeOf(k), body = bodyOf(k);
  if (m === 'm') return body.split('x').map(Number).includes(n);
  if (m === 'd'){ const [p,b] = body.split('/').map(Number); return b === n || p/b === n; }
  return false;
}

/* ---------- Rechenwege ---------- */

// Zu jeder Aufgabe ein Weg, wie man sie ableitet — nicht nur das Ergebnis.
// Jeder Schritt nennt echte Zwischenzahlen, damit man ihn mitrechnen kann.
// Rückgabe: { weg: 'Kurzname', schritte: ['…', '…'] }

const verdopple = n => `${n} + ${n} = ${n*2}`;

// Für a × b: den Faktor mit dem stärksten Trick als Anker nehmen.
const MAL_TRICKS = {
  1:  (a) => ({ weg:'Mal 1',        schritte:[`Mal 1 bleibt die Zahl: ${a}`] }),
  10: (a) => ({ weg:'Mal 10',       schritte:[`Eine Null anhängen: ${a} → ${a*10}`] }),
  2:  (a) => ({ weg:'Verdoppeln',   schritte:[verdopple(a)] }),
  5:  (a) => ({ weg:'Halber Zehner',schritte:[`${a} · 10 = ${a*10}`, `davon die Hälfte: ${a*5}`] }),
  9:  (a) => ({ weg:'Zehner minus', schritte:[`${a} · 10 = ${a*10}`, `minus ${a} → ${a*9}`] }),
  4:  (a) => ({ weg:'Zweimal verdoppeln', schritte:[verdopple(a), verdopple(a*2)] }),
  8:  (a) => ({ weg:'Dreimal verdoppeln', schritte:[verdopple(a), verdopple(a*2), verdopple(a*4)] }),
  3:  (a) => ({ weg:'Verdoppeln und dazu', schritte:[verdopple(a), `plus ${a} → ${a*3}`] }),
  6:  (a) => ({ weg:'Fünfer plus eins', schritte:[`${a} · 5 = ${a*5}`, `plus ${a} → ${a*6}`] }),
  7:  (a) => ({ weg:'Fünfer plus Zweier', schritte:[`${a} · 5 = ${a*5}`, `${a} · 2 = ${a*2}`, `zusammen ${a*7}`] })
};
// Reihenfolge: welcher Faktor gibt den einfacheren Weg?
const MAL_RANG = [1, 10, 2, 5, 9, 4, 3, 6, 8, 7];

function hintMal(a, b){
  const anker = MAL_RANG.find(n => n === a || n === b);
  const rest = anker === a ? b : a;          // die Zahl, die verrechnet wird
  return MAL_TRICKS[anker](rest);
}

function hintFor(k, task){
  const m = modeOf(k), body = bodyOf(k);

  if (m === 'm') return hintMal(...body.split('x').map(Number));

  if (m === 'd'){
    const [p, b] = body.split('/').map(Number), a = p / b;
    return { weg:'Rückwärts denken',
             schritte:[`Was mal ${b} ergibt ${p}?`, `${a} · ${b} = ${p}`, `also ${p} : ${b} = ${a}`] };
  }

  // Plus und Minus: aus dem Aufgabentext die beiden Zahlen zurückholen
  const [x, , y] = task.text.split(' ');
  const links = +x, rechts = +y;
  const zehner = n => Math.floor(n / 10) * 10;

  if (m === 'p'){
    const g = links, kl = rechts;
    const voll = 10 - (g % 10);            // so viel fehlt bis zum nächsten Zehner

    if (g % 10 === 0 && kl % 10 === 0)
      return { weg:'Nur die Zehner',
               schritte:[`${g/10} + ${kl/10} = ${(g+kl)/10}`, `also ${g+kl}`] };

    if (kl % 10 === 0)
      return { weg:'Erst die Zehner',
               schritte:[`${zehner(g)} + ${kl} = ${zehner(g)+kl}`, `die ${g%10} wieder dazu → ${g+kl}`] };

    if (kl < 10){
      // Einstellig und unter zehn: es gibt keine Zehner zum Zerlegen — weiterzählen
      if (g + kl < 10){
        const [gr, kn] = [Math.max(g,kl), Math.min(g,kl)];
        const kette = Array.from({length: kn}, (_, i) => gr + i + 1).join(', ');
        return { weg:'Weiterzählen', schritte:[`Von ${gr} aus ${kn} weiter: ${kette}`] };
      }
      if (g < 10 && g + kl === 10)
        return { weg:'Zehnerfreunde', schritte:[`${g} und ${kl} ergeben zusammen 10`] };
      if (g % 10 === 0)
        return { weg:'Einer anhängen', schritte:[`${g} ist glatt, ${kl} kommt hinten dran → ${g+kl}`] };
      if (voll === kl)
        return { weg:'Genau bis zum Zehner', schritte:[`${g%10} + ${kl} = 10`, `der Zehner wird voll → ${g+kl}`] };
      if ((g % 10) + kl < 10)
        return { weg:'Nur die Einer',
                 schritte:[`${g%10} + ${kl} = ${g%10 + kl}`, `die Zehner bleiben → ${g+kl}`] };
      return { weg:'Erst zum vollen Zehner',
               schritte:[`${g} + ${voll} = ${g+voll}`, `noch ${kl-voll} dazu`, `= ${g+kl}`] };
    }

    // beide zweistellig
    if ((g % 10) + (kl % 10) > 9)
      return { weg:'Erst die Zehner, dann die Einer',
               schritte:[`${g} + ${zehner(kl)} = ${g+zehner(kl)}`,
                         `${g+zehner(kl)} + ${kl%10} = ${g+kl}`] };
    return { weg:'Zehner und Einer getrennt',
             schritte:[`Zehner: ${zehner(g)} + ${zehner(kl)} = ${zehner(g)+zehner(kl)}`,
                       `Einer: ${g%10} + ${kl%10} = ${g%10 + kl%10}`, `zusammen ${g+kl}`] };
  }

  // Minus
  const min = links, sub = rechts;

  if (min % 10 === 0 && sub % 10 === 0)
    return { weg:'Nur die Zehner',
             schritte:[`${min/10} − ${sub/10} = ${(min-sub)/10}`, `also ${min-sub}`] };

  if (sub % 10 === 0)
    return { weg:'Erst die Zehner',
             schritte:[`${zehner(min)} − ${sub} = ${zehner(min)-sub}`, `die ${min%10} wieder dazu → ${min-sub}`] };

  if (sub < 10){
    // Unter zehn: Minus als Ergänzung denken, das ist der tragfähigere Weg
    if (min <= 10)
      return { weg:'Ergänzen',
               schritte:[`${sub} + wie viel ergibt ${min}?`, `${sub} + ${min-sub} = ${min}`,
                         `also bleibt ${min-sub}`] };
    if (min % 10 === 0)
      return { weg:'Einen Zehner aufbrechen',
               schritte:[`${min} = ${min-10} und 10`, `10 − ${sub} = ${10-sub}`, `also ${min-sub}`] };
    if (min % 10 === sub)
      return { weg:'Genau bis zum Zehner', schritte:[`${min%10} − ${sub} = 0`, `übrig bleibt ${min-sub}`] };
    if (min % 10 > sub)
      return { weg:'Nur die Einer',
               schritte:[`${min%10} − ${sub} = ${min%10 - sub}`, `die Zehner bleiben → ${min-sub}`] };
    return { weg:'Erst zum vollen Zehner',
             schritte:[`${min} − ${min%10} = ${zehner(min)}`, `noch ${sub - min%10} weg`, `= ${min-sub}`] };
  }

  // beide zweistellig
  if ((min % 10) < (sub % 10))
    return { weg:'Erst die Zehner, dann die Einer',
             schritte:[`${min} − ${zehner(sub)} = ${min-zehner(sub)}`,
                       `${min-zehner(sub)} − ${sub%10} = ${min-sub}`] };
  return { weg:'Zehner und Einer getrennt',
           schritte:[`Zehner: ${zehner(min)} − ${zehner(sub)} = ${zehner(min)-zehner(sub)}`,
                     `Einer: ${min%10} − ${sub%10} = ${min%10 - sub%10}`, `zusammen ${min-sub}`] };
}

/* ---------- Persistenz ---------- */

function fresh(){ return { facts: seedFacts(), session: 1, streak: 0, lastDay: null,
                           shades: SHADES, days: {}, mode: 'm' }; }

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.facts){
      // Stände von vor den Rechenarten trugen blanke Schlüssel wie "7x8"
      if (Object.keys(s.facts).some(k => !k.includes(':'))){
        const alt = s.facts; s.facts = seedFacts();
        for (const k in alt) if (s.facts['m:'+k]) s.facts['m:'+k] = alt[k];
      }
      // neu hinzugekommene Aufgaben ergänzen, ohne Bekanntes zu verlieren
      const soll = seedFacts();
      for (const k in soll) if (!s.facts[k]) s.facts[k] = soll[k];
      if (!MODE[s.mode]) s.mode = 'm';
      // Stand einer anderen Skalenlänge anteilig umrechnen
      const old = s.shades || 0;
      Object.values(s.facts).forEach(f => {
        f.solved = (!old || f.solved == null) ? 0
                 : Math.min(SHADES, Math.round(f.solved * SHADES / old));
        if (f.tries == null) f.tries = f.times.length + f.wrong;   // Näherung für alte Stände
        if (!f.times) f.times = [];
      });
      s.shades = SHADES;
      if (!s.days) s.days = {};   // Verlauf erst ab jetzt
      return s;
    }
  } catch (e) { /* ponytail: kaputter/gesperrter Speicher => frisch anfangen */ }
  return fresh();
}
let storageBroken = false;
function saveState(s){
  try { localStorage.setItem(KEY, JSON.stringify(s)); storageBroken = false; }
  catch (e) { storageBroken = true; }   // Privat-Fenster oder Speicher voll — nie stumm bleiben
  if (typeof showStorageWarning === 'function') showStorageWarning();
}

/* ---------- Auswahl & Bewertung ---------- */

const isDue = (st, k) => st.session - st.facts[k].lastSession >= INTERVAL[st.facts[k].box];

function dueFacts(st){
  return Object.keys(st.facts).filter(k => isDue(st, k));
}

// Filter anwenden — aber nie den Topf leeren
function narrow(pool, fn){ const s = pool.filter(fn); return s.length ? s : pool; }

// ctx: { asked, lastKey, hardStreak, queue:[{key,task,at}], row, mode }
// Liefert immer { key, task } — die Aufgabe gehört dazu, weil sie bei Plus/Minus
// erzeugt wird und eine Wiederholung dieselben Zahlen zeigen muss.
function pickNext(st, ctx){
  // 1. fällige Korrektur-Wiederholung hat Vorrang
  const qi = ctx.queue.findIndex(e => e.at <= ctx.asked);
  if (qi >= 0){ const e = ctx.queue.splice(qi, 1)[0]; return { key: e.key, task: e.task || makeTask(e.key) }; }

  let pool = factsOf(st, ctx.mode);
  if (ctx.row) pool = pool.filter(k => inRow(k, ctx.row));

  // Einstieg mit Erfolgserlebnis / Frust-Bremse nach zwei harten Aufgaben.
  // Beides steht VOR der Fälligkeit: am Anfang sind nur die harten Fakten fällig,
  // und eine Auffrischung ist besser als die dritte schwere Aufgabe in Folge.
  if (ctx.asked < 2)            pool = narrow(pool, k => factDiff(k) === 0);
  else if (ctx.hardStreak >= 2) pool = narrow(pool, k => factDiff(k) < 2);

  pool = narrow(pool, k => isDue(st, k));
  pool = narrow(pool, k => k !== ctx.lastKey);

  // Gewicht aus der gespeicherten Statistik: noch nie gesehen zuerst,
  // dann was am wenigsten sitzt, dann was oft danebenging.
  const w = k => {
    const f = st.facts[k];
    if (!f.times.length) return SHADES + 4;
    return Math.max(1, (SHADES - f.solved) + Math.min(f.wrong, 3));
  };
  let r = Math.random() * pool.reduce((s,k) => s + w(k), 0);
  let key = pool[pool.length - 1];
  for (const k of pool){ r -= w(k); if (r <= 0){ key = k; break; } }
  return { key, task: makeTask(key) };
}

// Die Runde ist vorbei, sobald der Fortschrittsbalken voll ist — nie später.
const sessionOver = run => run.asked >= SESSION_LEN;

// -> 'up' | 'stay' | 'down'
function grade(st, k, correct, ms){
  const f = st.facts[k];
  f.lastSession = st.session;
  f.tries++;
  f.times = [...f.times, Math.round(ms)].slice(-5);
  const shade = n => f.solved = Math.max(0, Math.min(SHADES, f.solved + n));
  if (!correct){ f.box = 1; f.wrong++; shade(-P_WRONG); return 'down'; }
  if (ms < FAST_MS){
    shade(P_FAST);
    if (f.box < 5) f.box++;
    return 'up';
  }
  shade(P_SLOW);   // gerechnet statt abgerufen: Box bleibt, aber die Karte bewegt sich
  return 'stay';
}

/* ---------- Tagesverlauf ---------- */

// Eine Zeile pro Tag: geübt, davon richtig, davon aus dem Kopf abgerufen.
function logDay(correct, fast){
  const d = dayStamp(Date.now());
  const day = st.days[d] || (st.days[d] = { n: 0, right: 0, fast: 0 });
  day.n++;
  if (correct) day.right++;
  if (fast) day.fast++;
}

// Die letzten n Tage lückenlos — Pausen sollen als Lücke sichtbar bleiben.
function lastDays(n){
  const out = [];
  for (let i = n - 1; i >= 0; i--){
    const key = dayStamp(Date.now() - i * 864e5);
    out.push({ key, ...(st.days[key] || { n: 0, right: 0, fast: 0 }) });
  }
  return out;
}

/* ---------- Streak ---------- */

const dayStamp = t => new Date(t).toLocaleDateString('sv');   // sv => YYYY-MM-DD, lokal

function bumpStreak(st){
  const t = dayStamp(Date.now());
  if (st.lastDay === t) return;
  st.streak = st.lastDay === dayStamp(Date.now() - 864e5) ? st.streak + 1 : 1;
  st.lastDay = t;
}

/* ============================================================
   Belohnung — Konfetti auf Canvas, gestuft:
   richtig < neu gemerkt < Runde geschafft. Selten genug, dass es wirkt.
   ============================================================ */

const CONFETTI = ['#0e7f99','#57bcd2','#e8b93f','#c2691a','#c0587f','#3f7dbf'];
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

const fx = document.getElementById('fx');
const fxc = fx.getContext('2d');
let bits = [], anim = 0;

function fitCanvas(){
  const r = Math.min(devicePixelRatio || 1, 2);
  fx.width = innerWidth * r; fx.height = innerHeight * r;
  fxc.setTransform(r, 0, 0, r, 0, 0);
}
fitCanvas();
addEventListener('resize', fitCanvas);

// mode: 'burst' = Sternchen vom Punkt weg, 'rain' = Konfetti von oben
function celebrate(n, mode, x, y){
  if (calm) return;
  for (let i = 0; i < n; i++){
    const a = mode === 'rain' ? Math.PI/2 + (Math.random()-.5) : Math.random() * 2*Math.PI;
    const v = mode === 'rain' ? 1 + Math.random()*2 : 3 + Math.random()*6;
    bits.push({
      x: mode === 'rain' ? Math.random() * innerWidth : x,
      y: mode === 'rain' ? -20 - Math.random()*innerHeight*.4 : y,
      vx: Math.cos(a)*v, vy: Math.sin(a)*v - (mode === 'rain' ? 0 : 3),
      w: 5 + Math.random()*6, h: 3 + Math.random()*5,
      rot: Math.random()*6, spin: (Math.random()-.5)*.35,
      col: CONFETTI[i % CONFETTI.length], life: 1
    });
  }
  if (!anim) anim = requestAnimationFrame(tick);
}

function tick(){
  fxc.clearRect(0, 0, innerWidth, innerHeight);
  bits = bits.filter(b => {
    b.vy += .22; b.vx *= .99;
    b.x += b.vx; b.y += b.vy; b.rot += b.spin;
    if (b.y > innerHeight + 40) return false;
    fxc.save();
    fxc.translate(b.x, b.y); fxc.rotate(b.rot);
    fxc.fillStyle = b.col;
    fxc.fillRect(-b.w/2, -b.h/2, b.w, b.h);
    fxc.restore();
    return true;
  });
  anim = bits.length ? requestAnimationFrame(tick) : 0;
}

// Mittelpunkt eines Elements — damit der Burst aus der Antwort kommt
function centerOf(el){
  const r = el.getBoundingClientRect();
  return [r.left + r.width/2, r.top + r.height/2];
}

/* ============================================================
   UI
   ============================================================ */

const $ = id => document.getElementById(id);
const show = id => document.querySelectorAll('.screen')
  .forEach(s => s.classList.toggle('on', s.id === id));

let st = loadState();
let run = null;   // laufende Session

/* ---------- Landkarte ---------- */

// Mal und Geteilt: 10×10-Gitter. Plus und Minus: die acht Aufgabentypen als Liste,
// denn dort gibt es tausende Aufgaben, aber nur eine Handvoll Sorten.
function renderGrid(el, won, mode){
  mode = mode || st.mode;
  let nth = 0;
  const frisch = k => won && won.includes(k);
  const delay  = () => ` style="animation-delay:${(nth++) * .12 + .25}s"`;

  if (!MODE[mode].grid){
    el.className = 'steps';
    el.innerHTML = STEPS.map(step => {
      const k = mode + ':' + step.id;
      return `<div data-k="${k}"><span>${step.name}</span>` +
             `<b class="s${st.facts[k].solved}${frisch(k) ? ' won' : ''}"` +
             `${frisch(k) ? delay() : ''}></b></div>`;
    }).join('');
    return;
  }

  el.className = 'map';
  const kopf = mode === 'm' ? '×' : ':';
  const cells = [`<div class="hd">${kopf}</div>`];
  for (let b=1; b<=N; b++) cells.push(`<div class="hd">${b}</div>`);
  for (let a=1; a<=N; a++){
    cells.push(`<div class="hd">${a}</div>`);
    for (let b=1; b<=N; b++){
      const k = mode === 'm' ? `m:${a}x${b}` : `d:${a*b}/${b}`;
      const f = frisch(k);
      cells.push(`<div class="s${st.facts[k].solved}${f ? ' won' : ''}" data-k="${k}"${f ? delay() : ''}></div>`);
    }
  }
  el.innerHTML = cells.join('');
}

// Wie gut sitzt eine Reihe? Aus den gespeicherten Stufen aller ihrer Aufgaben.
function rowState(mode, n){
  const ks = factsOf(st, mode).filter(k => inRow(k, n));
  const werte = ks.map(k => st.facts[k].solved);
  return {
    schnitt: werte.reduce((a,v) => a+v, 0) / werte.length,
    schwaechste: Math.min(...werte),
    // "sitzt" heißt: keine einzige Aufgabe der Reihe hängt noch zurück
    sitzt: Math.min(...werte) >= SHADES - 1
  };
}

function renderRows(){
  const box = $('rows');
  if (!MODE[st.mode].grid){ box.innerHTML = ''; box.style.display = 'none'; return; }
  box.style.display = '';
  box.innerHTML = Array.from({length:N}, (_, i) => {
    const n = i + 1, r = rowState(st.mode, n);
    const stufe = Math.round(r.schnitt);
    const titel = r.sitzt ? `${n}er sitzt — alle Aufgaben auf Stufe ${SHADES-1} oder höher`
                          : `${n}er — Schnitt Stufe ${stufe} von ${SHADES}`;
    return `<button data-row="${n}" style="--rowcolor:var(--s${stufe})"` +
           `${r.sitzt ? ' disabled' : ''} title="${titel}">` +
           `${n}er${r.sitzt ? ' ✓' : ''}</button>`;
  }).join('');
}

function stats(){
  const f = factsOf(st, st.mode).map(k => st.facts[k]);
  return {
    neu:   f.filter(x => !x.times.length).length,
    offen: f.filter(x => x.times.length && x.solved < SHADES).length,
    sitzt: f.filter(x => x.solved >= SHADES).length
  };
}

function showStorageWarning(){
  const el = $('saveNote');
  if (!el) return;
  const t = stats();
  el.textContent = storageBroken
    ? 'Speichern klappt hier nicht — im Privat-Fenster geht der Fortschritt verloren'
    : `${t.neu} neu · ${t.offen} am Üben · ${t.sitzt} sitzen` +
      (st.streak > 1 ? ` · ${st.streak} Tage am Stück` : '');
  el.style.color = storageBroken ? 'var(--warm)' : '';
}

/* ---------- Verlauf zeichnen ---------- */

const WEEKDAY = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const LOG_DAYS = 14;

function renderLog(){
  const days = lastDays(LOG_DAYS);
  const max = Math.max(1, ...days.map(d => d.n));
  const heute = dayStamp(Date.now());

  $('lMax').textContent = `höchstens ${max} Aufgaben am Tag`;
  $('lBars').innerHTML = days.map(d => {
    if (!d.n) return `<span data-d="${d.key}" style="height:2px"><i class="none"></i></span>`;
    const falsch = d.n - d.right;
    const h = Math.max(4, Math.round(d.n / max * 100));
    // Das oberste sichtbare Segment trägt die runde Kappe
    const seg = falsch > 0
      ? `<i class="w cap" style="height:${falsch / d.n * 100}%"></i><i class="r" style="height:${d.right / d.n * 100}%"></i>`
      : `<i class="r cap" style="height:100%"></i>`;
    return `<span class="${d.key === heute ? 'today' : ''}" data-d="${d.key}" style="height:${h}%">${seg}</span>`;
  }).join('');
  $('lLabels').innerHTML = days.map(d =>
    `<span>${WEEKDAY[new Date(d.key + 'T12:00').getDay()]}</span>`).join('');

  const alle = Object.values(st.days);
  const total = alle.reduce((a, d) => a + d.n, 0);
  const right = alle.reduce((a, d) => a + d.right, 0);
  const tage  = alle.filter(d => d.n > 0).length;
  $('lRight').textContent = right;
  $('lWrong').textContent = total - right;
  $('lRate').textContent = total ? Math.round(right / total * 100) + '%' : '–';
  $('lTotal').textContent = total
    ? `${total} Aufgaben an ${tage} ${tage === 1 ? 'Tag' : 'Tagen'}`
    : '';
  $('lTip').textContent = total
    ? 'Auf einen Balken tippen zeigt den Tag'
    : 'Noch nichts geübt — nach der ersten Runde steht hier etwas.';
}

// Tooltip als Zeile statt als Overlay: funktioniert am Handy genauso wie am Laptop
function dayLine(key){
  const d = st.days[key];
  const datum = new Date(key + 'T12:00').toLocaleDateString('de', { weekday:'long', day:'numeric', month:'long' });
  if (!d || !d.n) return `${datum} — nicht geübt`;
  return `${datum} — ${d.n} Aufgaben · ${d.right} richtig, ${d.n - d.right} falsch · ${d.fast} aus dem Kopf`;
}

/* ---------- Session ---------- */

function start(row){
  run = { asked:0, right:0, up:0, won:[], lastKey:null, hardStreak:0, queue:[],
          mode: st.mode, row: row||0, key:null, task:null, t0:0, input:'', locked:false };
  // Session hier hochzählen, nicht am Ende: eine abgebrochene Runde ist
  // trotzdem eine Runde, sonst rücken die Wiedervorlagen nie vor.
  st.session++;
  bumpStreak(st);
  saveState(st);
  show('s-quiz');
  next();
}

function next(){
  if (sessionOver(run)) return finish();
  const pick = pickNext(st, run);
  run.key  = pick.key;
  run.task = pick.task;
  run.input = '';
  run.locked = false;
  $('task').textContent = run.task.text + ' =';
  $('hint').textContent = '';
  $('stage').className = 'stage';
  versteckeWeg();
  showAnswer('');
  draw();
  run.t0 = performance.now();
}

// Genau eine Stelle schreibt die große Zeile — vorher tat das auch draw(),
// was die eingeblendete Lösung sofort wieder mit der Falscheingabe überschrieb.
function showAnswer(text){ $('ans').textContent = text; }

function draw(){
  $('dots').innerHTML = Array.from({length:SESSION_LEN}, (_,i) =>
    `<i class="${i < run.asked ? 'done' : ''}"></i>`).join('');
  $('pad').querySelector('.ok').disabled = !run.input;
}

function submit(){
  if (run.locked || !run.input) return;
  run.locked = true;
  const ms = performance.now() - run.t0;
  const correct = Number(run.input) === run.task.answer;
  const before = st.facts[run.key].solved;
  const res = grade(st, run.key, correct, ms);

  run.asked++;
  if (correct) run.right++;
  if (res === 'up') run.up++;
  run.hardStreak = factDiff(run.key) === 2 ? run.hardStreak + 1 : 0;
  run.lastKey = run.key;
  logDay(correct, res === 'up');

  if (correct){
    const mastered = res !== 'down' && st.facts[run.key].solved === SHADES
                     && before < SHADES;
    if (mastered) run.won.push(run.key);
    $('stage').classList.add('good');
    if (mastered) $('stage').classList.add('win');
    $('hint').textContent = mastered ? 'Das sitzt jetzt! 🎉'
                          : res === 'up' ? 'Richtig — und schnell!'
                          : 'Richtig';
    // gestuft: nur der echte Meilenstein bekommt Konfetti
    if (mastered) celebrate(26, 'burst', ...centerOf($('ans')));
    else if (res === 'up') celebrate(8, 'burst', ...centerOf($('ans')));
  } else {
    // gleiche Aufgabe kommt in dieser Runde nochmal
    // Wiederholung ins verbleibende Fenster ziehen — die Runde wird davon nie länger.
    run.queue.push({ key: run.key, task: run.task,
                     at: Math.min(run.asked + REDO_GAP, SESSION_LEN - 1) });
    $('stage').classList.add('bad');
    showAnswer(run.task.answer);          // die Lösung steht jetzt in der Zeile
    $('hint').textContent = `Du hattest ${run.input} — richtig ist ${run.task.answer}`;
    zeigeWeg();
  }
  draw();
  saveState(st);
  // Nach einem Fehler läuft nichts automatisch weiter — sie bestätigt selbst,
  // wenn sie den Rechenweg gelesen hat.
  if (correct)
    run.timer = setTimeout(next, run.won.includes(run.key) ? 1100 : 450);
}

// Zeigt den Rechenweg und wartet auf „Verstanden" — solange bleibt alles stehen.
function zeigeWeg(){
  const h = hintFor(run.key, run.task);
  $('tip').innerHTML = `<h2>${h.weg}</h2><ol>` +
    h.schritte.map((z, i) => `<li><span>${i+1}</span>${z}</li>`).join('') + '</ol>';
  $('tip').hidden = false;
  $('pad').hidden = true;
  $('gotIt').hidden = false;
}

function versteckeWeg(){
  $('tip').hidden = true;
  $('pad').hidden = false;
  $('gotIt').hidden = true;
}

function finish(){
  saveState(st);
  $('dRight').textContent = `${run.right}/${run.asked}`;
  $('dNew').textContent = run.up;
  $('dStreak').textContent = st.streak;
  const perfect = run.right === run.asked;
  $('doneTitle').textContent = perfect ? 'Alles richtig! 🌟' : 'Geschafft!';
  renderGrid($('grid2'), run.won, run.mode);
  show('s-done');
  celebrate(perfect ? 90 : run.won.length ? 55 : 30, 'rain');
}

$('pad').innerHTML =
  [1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('') +
  '<button class="del" data-k="del" aria-label="Löschen">⌫</button>' +

// Zeigt beim Zeigen oder Antippen eines Feldes dessen Bilanz — ohne das Ergebnis,
// sonst wird die Landkarte zum Spickzettel.
function factLine(k){
  const f = st.facts[k];
  const m = modeOf(k), body = bodyOf(k);
  const name = m === 'm' ? body.replace('x', ' × ')
             : m === 'd' ? body.replace('/', ' : ')
             : STEPS.find(x => x.id === body).name;
  if (!f.tries) return `${name} — noch nicht geübt`;
  return `${name} — ${f.tries} mal gerechnet · ${f.tries - f.wrong} richtig, ${f.wrong} falsch`;
}

function wireMap(mapEl, legendEl){
  const reset = () => { legendEl.classList.remove('info'); legendEl.innerHTML = legendHTML; };
  const show = e => {
    const zelle = e.target.closest('[data-k]');
    if (!zelle) return;
    legendEl.classList.add('info');
    legendEl.textContent = factLine(zelle.dataset.k);
  };
  mapEl.addEventListener('mouseover', show);
  mapEl.addEventListener('mouseleave', reset);
  mapEl.addEventListener('click', show);       // Touch: antippen statt zeigen
  return reset;
}

// Legende aus der Skala erzeugen — sie kann gar nicht mehr veralten
const legendHTML = 'neu <span class="bar">' +
  Array.from({length: SHADES + 1}, (_, i) => `<i class="s${i}"></i>`).join('') +
  '</span> sitzt';
const legends = [...document.querySelectorAll('.legend')];
legends.forEach(el => el.innerHTML = legendHTML);
const resetLegend = [
  wireMap($('grid'),  legends[0]),
  wireMap($('grid2'), legends[1])
];

$('rows').innerHTML = Array.from({length:N}, (_,i) =>
  `<button data-row="${i+1}">${i+1}er</button>`).join('');

function key(k){
  if (!run || run.locked) return;
  if (k === 'ok') return submit();
  if (k === 'del') run.input = run.input.slice(0, -1);
  else if (run.input.length < 3) run.input += k;
  showAnswer(run.input);
  draw();
}

$('pad').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) key(b.dataset.k);
});
addEventListener('keydown', e => {
  if (!$('s-quiz').classList.contains('on')) return;
  if (!$('gotIt').hidden){                     // Rechenweg steht: nur weiter
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); next(); }
    return;
  }
  if (e.key >= '0' && e.key <= '9') key(e.key);
  else if (e.key === 'Backspace'){ e.preventDefault(); key('del'); }
  else if (e.key === 'Enter') key('ok');
});

      return true; })());
  ok('Minus ergibt nie etwas Negatives', (() => {
      for (const step of STEPS) for (let i = 0; i < 400; i++)
        if (makeTask('s:' + step.id).answer < 0) return false;
      return true; })());
  ok('Uebergangs-Typen halten ihre Zusage', (() => {
      const pruef = (id, soll) => {
        for (const m of ['p','s']) for (let i = 0; i < 400; i++){
          const t = makeTask(m + ':' + id);
          const [x,,y] = t.text.split(' ');
          const [a,b] = m === 'p' ? [+x,+y] : [+x - +y, +y];
          if (((a % 10) + (b % 10) > 9) !== soll) return false;
        }
        return true;
      };
      return pruef('e1', false) && pruef('d1', false)
          && pruef('e2', true)  && pruef('d2', true); })());

  // --- Reihen-Zustand ---
  ok('gekonnte Reihe wird als sitzend erkannt', (() => {
      const x = mk();
      factsOf(x,'m').filter(k => inRow(k,7)).forEach(k => x.facts[k].solved = SHADES);
      const save = st; st = x; const r = rowState('m', 7); st = save;
      return r.sitzt && r.schnitt === SHADES; })());
  ok('eine schwache Aufgabe haelt die Reihe offen', (() => {
      const x = mk();
      factsOf(x,'m').filter(k => inRow(k,7)).forEach(k => x.facts[k].solved = SHADES);
      x.facts['m:7x8'].solved = 2;
      const save = st; st = x; const r = rowState('m', 7); st = save;
      return !r.sitzt; })());
  ok('frische Reihe ist nicht gekonnt', (() => {
      const save = st; st = mk(); const r = rowState('m', 7); st = save;
      return !r.sitzt && r.schnitt === 0; })());

  // --- Rechenwege ---
  ok('jede Aufgabe hat einen Rechenweg', (() => {
      for (const k of Object.keys(seedFacts())){
        const runden = (modeOf(k) === 'p' || modeOf(k) === 's') ? 60 : 1;
        for (let i = 0; i < runden; i++){
          const t = makeTask(k);
          const h = hintFor(k, t);
          if (!h || !h.weg || !h.schritte || !h.schritte.length) return false;
        }
      }
      return true; })());
  ok('jeder Rechenweg endet auf dem Ergebnis', (() => {
      for (const k of Object.keys(seedFacts())){
        const runden = (modeOf(k) === 'p' || modeOf(k) === 's') ? 60 : 1;
        for (let i = 0; i < runden; i++){
          const t = makeTask(k);
          const letzte = hintFor(k, t).schritte.at(-1).match(/-?\d+/g);
          if (!letzte || +letzte.at(-1) !== t.answer) return false;
        }
      }
      return true; })());
  ok('jede Gleichung im Rechenweg stimmt', (() => {
      for (const k of Object.keys(seedFacts())){
        const runden = (modeOf(k) === 'p' || modeOf(k) === 's') ? 60 : 1;
        for (let i = 0; i < runden; i++){
          for (const z of hintFor(k, makeTask(k)).schritte)
            for (const g of z.matchAll(/(-?\d+)\s*([+−·:])\s*(-?\d+)\s*=\s*(-?\d+)/g)){
              const soll = g[2] === '+' ? +g[1] + +g[3] : g[2] === '·' ? +g[1] * +g[3]
                         : g[2] === ':' ? +g[1] / +g[3] : +g[1] - +g[3];
              if (soll !== +g[4]) return false;
            }
        }
      }
      return true; })());
  ok('kein Rechenweg rechnet mit null', (() => {
      for (const k of Object.keys(seedFacts())){
        const runden = (modeOf(k) === 'p' || modeOf(k) === 's') ? 60 : 1;
        for (let i = 0; i < runden; i++)
          for (const z of hintFor(k, makeTask(k)).schritte)
            if (/[+−] 0\b/.test(z) || /\bnoch 0\b/.test(z)) return false;
      }
      return true; })());
  ok('7x8 wird verdoppelt', hintFor('m:7x8', makeTask('m:7x8')).weg === 'Dreimal verdoppeln');
  ok('mal 9 geht ueber den Zehner', hintFor('m:6x9', makeTask('m:6x9')).weg === 'Zehner minus');
  ok('Division denkt rueckwaerts', hintFor('d:56/7', makeTask('d:56/7')).weg === 'Rückwärts denken');

  const msg = fails.length ? `${fails.length} Fehler: ${fails.join(' · ')}` : 'alle Tests grün';
  console.log(msg);
  document.title = msg;
  document.getElementById('app').innerHTML =
    `<pre style="padding:20px;font:14px/1.6 ui-monospace,monospace;white-space:pre-wrap">${msg}</pre>`;
}
</script>
